      :root {

        --letter-spacing: -1px;

        --paragraph: 1rem;

        --blue-medium: #3381f3;

        --partner-tooltip: #0000004d;
        --gray-50: grey;
        --yellow-dark: #f1b13f;

        --quote-2: 1.5rem;
        --transparent: #fff0;
        --paragraph-large: var(--h4);
        --navy: #050348;
        --teal: #60e2b7;
        --blurple: #532aff;
        --blue-2: #0280fb;
        --blue-2-hover: #4ea8ff;
        --p2: 1.1rem;
        --moloco-blue: var(--gray-50);

        display: block;

        margin-bottom: 5px;
      }
      .site-container {
        width: 914px; /*874px;*/
        margin: 0 auto;
        padding: 0 20px;
        background-color: #fff;

        @media (max-width: 768px) {
          width: 100%;
        }
      }
      .service-disruption-container {
        border: 1px solid black;
        margin-bottom: 20px;
      }
